name: Build LAST ARMORY
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  macos:
    strategy:
      matrix:
        include:
          - runner: macos-latest      # Apple Silicon
            arch: arm64
          - runner: macos-15-intel    # Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: bash mac/build_mac_app.sh
      - name: Self-test the built app on this Mac (engine, models, animations)
        run: dist/LastArmory.app/Contents/MacOS/LastArmory --selftest
      - uses: actions/upload-artifact@v6
        with:
          name: LastArmory-macOS-${{ matrix.arch }}
          path: dist/LastArmory-macOS.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller "panda3d>=1.10.15"
      - run: python -m PyInstaller --noconfirm --onedir --windowed --name LastArmory --collect-binaries panda3d LastArmory.py
      - run: python -m PyInstaller --noconfirm --onefile --console --name ArmoryServer --exclude-module panda3d --exclude-module direct --distpath dist/LastArmory ArmoryServer.py
      - shell: bash
        run: cp -r mods README.md MODDING.md dist/LastArmory/
      - name: Self-test the built exe (engine, models, animations)
        shell: bash
        run: dist/LastArmory/LastArmory.exe --selftest
      - uses: actions/upload-artifact@v6
        with:
          name: LastArmory-Windows
          path: dist/LastArmory
